name: Purge jsDelivr cache

on:
  push:
    branches: [main]
    paths:
      - 'planner.js'
      - 'geo.js'
      - 'widget-init.js'

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr cache
        run: |
          FILES=(
            "planner.js"
            "geo.js"
            "widget-init.js"
          )
          for f in "${FILES[@]}"; do
            url="https://purge.jsdelivr.net/gh/EkaterinaMochalova/dspbov2.0@main/${f}"
            echo "Purging: $url"
            curl -s "$url" | python3 -c "import sys,json; d=json.load(sys.stdin); print('status:', d.get('status','?'))"
          done
